name: CI

# Checks for every pull request and for main. No secrets are used here;
# publishing is done only by docker-publish.yml from release tags.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  HADOLINT_VERSION: "2.14.0"
  HADOLINT_SHA256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"
  ACTIONLINT_VERSION: "1.7.8"
  ACTIONLINT_SHA256: "be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a"
  # Images the docker actions would otherwise pull by a moving tag.
  BUILDKIT_IMAGE: "moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea"
  BINFMT_IMAGE: "tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"
  # Trivy is installed from the release tarball, checked by sha256
  # (release signature verified with cosign when this was pinned).
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck, hadolint and actionlint
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The container scripts run under busybox sh.
      - name: shellcheck
        run: |
          shellcheck --shell=busybox --severity=warning scripts/*
          shellcheck tests/*.sh tests/acme/*.sh

      - name: hadolint
        run: hadolint Dockerfile

      - name: actionlint
        run: actionlint

  # Build the image natively, scan it and run the smoke test (password and
  # certificate login, traffic through the tunnel).
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ocserv:ci

      - name: Trivy (fixable HIGH/CRITICAL fail the build)
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 ocserv:ci

      - name: Install the VPN client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openconnect ocproxy

      - name: Smoke test
        run: tests/smoke.sh ocserv:ci

      # Which logins each AUTH_MODE accepts and rejects.
      - name: Authentication modes test
        run: tests/auth-modes.sh ocserv:ci

      # Client certificates: issue, renew, revoke, old serial 01, CRL.
      - name: Client certificates test
        run: tests/clients.sh ocserv:ci

      # Certificate issue and renewal through get-cert.sh, against Pebble.
      - name: ACME test
        if: matrix.platform == 'linux/amd64'
        timeout-minutes: 10
        run: tests/acme.sh ocserv:ci

  # armv7 has no native runner; make sure it still builds (under QEMU).
  build-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm/v7
          push: false
